name: Python correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Public examples
        run: |
          python examples/bell_state.py
          python examples/simple_circuit.py
          python examples/measurement_demo.py
          python examples/bb84_protocol.py
      - name: Installed compatibility imports outside checkout
        working-directory: /tmp
        run: python -c 'from q3 import Circuit; from qkd import qkd_decision; assert qkd_decision(n=1, seed=0)["secure"] is False'
